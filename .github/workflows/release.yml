name: Publish Desktop Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root PWA Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Install Desktop Wrapper Dependencies
        working-directory: ./Brain-Stormers-Desktop
        run: npm install

      - name: Build and Publish Electron App
        working-directory: ./Brain-Stormers-Desktop
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
