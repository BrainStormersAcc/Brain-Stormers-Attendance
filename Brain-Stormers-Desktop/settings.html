<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Device Activation Settings</title>
  <style>
    :root {
      --bg-base: #1c1f26;
      --bg-surface: #1c1f26;
      --bg-surface-elevated: #242932;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --color-primary: #3b82f6;
      --color-success: #10b981;
      --color-danger: #ef4444;
      --border-color: rgba(255, 255, 255, 0.03);
      
      --color-shadow-light: #252932;
      --color-shadow-dark: #13151a;
      --neu-shadow-raised: -8px -8px 16px var(--color-shadow-light), 8px 8px 16px var(--color-shadow-dark);
      --neu-shadow-pressed: inset -4px -4px 8px var(--color-shadow-light), inset 4px 4px 8px var(--color-shadow-dark);
    }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
    }
    
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      box-shadow: var(--neu-shadow-raised);
      padding: 32px;
      width: 100%;
      max-width: 440px;
      box-sizing: border-box;
    }
    
    h2 {
      font-size: 1.25rem;
      margin: 0 0 8px 0;
      font-weight: 700;
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .desc {
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.02em;
    }

    select {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: var(--neu-shadow-pressed);
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
      appearance: none;
    }

    .select-wrapper {
      position: relative;
    }

    .select-wrapper::after {
      content: '▼';
      font-size: 0.7rem;
      color: var(--text-muted);
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .status-alert {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      line-height: 1.4;
      margin-bottom: 20px;
      display: none;
    }

    .status-success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: var(--color-success);
    }

    .status-error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--color-danger);
    }

    .time-item, .period-item {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s ease;
      width: 80%;
      text-align: center;
      user-select: none;
    }
    .time-item:hover, .period-item:hover {
      background: var(--bg-surface);
      color: var(--text-primary);
    }
    .time-item.selected, .period-item.selected {
      background: var(--color-primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
      font-weight: 600;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }
    .neu-card-raised {
      background: var(--bg-surface-elevated);
      box-shadow: -8px -8px 16px var(--color-shadow-light), 8px 8px 16px var(--color-shadow-dark);
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: var(--neu-shadow-raised);
      transition: all 0.2s ease;
      outline: none;
    }

    button:active {
      box-shadow: var(--neu-shadow-pressed);
    }

    button.accent {
      background: var(--bg-surface-elevated);
      color: var(--color-primary);
      border: 1px solid rgba(59, 130, 246, 0.15);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none !important;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>⚙️ Biometric Settings</h2>
    <p class="desc">Sync and load central ZKFinger license keys to authenticate this PC's hardware module.</p>
    
    <div id="alertBox" class="status-alert"></div>

    <div class="form-group">
      <label for="deviceSelect">Select Registered PC Scanner</label>
      <div class="select-wrapper">
        <select id="deviceSelect" disabled>
          <option value="">Loading registered devices...</option>
        </select>
      </div>
    </div>

    <div class="form-group" style="margin-bottom: 20px;">
      <label for="serviceAccountInput">Firebase Service Account Key (.json)</label>
      <div style="display: flex; gap: 8px; align-items: center;">
        <input type="text" id="serviceAccountInput" placeholder="No file selected" readonly 
               style="flex: 1; padding: 12px; background: var(--bg-surface); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: var(--neu-shadow-pressed); font-size: 0.85rem; outline: none; box-sizing: border-box; text-overflow: ellipsis; white-space: nowrap; overflow: hidden;" />
        <button type="button" id="browseBtn" style="flex: 0 0 100px; padding: 12px; margin: 0;">Browse</button>
      </div>
    </div>

    <div class="form-group" style="margin-bottom: 24px; position: relative;">
      <label>Late Cutoff Time (HH:MM)</label>
      
      <!-- Custom selector input display -->
      <div id="cutoffDisplay" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--bg-surface); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: var(--neu-shadow-pressed); font-size: 0.85rem; cursor: pointer; user-select: none;">
        <span id="cutoffValueText">09:30 AM</span>
        <span style="color: var(--text-secondary); font-size: 0.9rem;">🕒</span>
      </div>

      <!-- Dropdown picker panel -->
      <div id="timePickerDropdown" class="neu-card-raised" style="display: none; position: absolute; top: 68px; left: 0; right: 0; border: 1px solid var(--border-color); border-radius: 18px; padding: 16px; z-index: 100; animation: slideDown 0.2s ease-out; flex-direction: column; gap: 14px;">
        <div style="display: flex; justify-content: space-around; gap: 8px;">
          
          <!-- Hour scroll list -->
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1;">
            <span style="font-size: 0.7rem; color: var(--text-secondary); font-weight: 600;">Hour</span>
            <div id="hourScroll" class="custom-scroll" style="display: flex; flex-direction: column; align-items: center; width: 100%; max-height: 110px; overflow-y: auto; gap: 4px; padding: 4px 0;">
              <!-- Dynamically populated -->
            </div>
          </div>
          
          <!-- Minute scroll list -->
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1;">
            <span style="font-size: 0.7rem; color: var(--text-secondary); font-weight: 600;">Min</span>
            <div id="minuteScroll" class="custom-scroll" style="display: flex; flex-direction: column; align-items: center; width: 100%; max-height: 110px; overflow-y: auto; gap: 4px; padding: 4px 0;">
              <!-- Dynamically populated -->
            </div>
          </div>

          <!-- AM/PM selector -->
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 0 0 60px;">
            <span style="font-size: 0.7rem; color: var(--text-secondary); font-weight: 600;">Period</span>
            <div style="display: flex; flex-direction: column; gap: 8px; justify-content: center; height: 110px; align-items: center; width: 100%;">
              <div class="period-item selected" data-val="AM">AM</div>
              <div class="period-item" data-val="PM">PM</div>
            </div>
          </div>
        </div>

        <button type="button" id="closeTimePicker" class="accent" style="margin: 0; padding: 10px; font-size: 0.8rem; border-radius: 10px; width: 100%;">Confirm Time</button>
      </div>
    </div>

    <div class="btn-group">
      <button type="button" id="cancelBtn">Cancel</button>
      <button type="button" id="refreshBtn" class="accent">Fetch Devices</button>
      <button type="button" id="saveBtn" disabled>Save</button>
    </div>
  </div>

  <script>
    let fetchedDevices = [];
    let savedSettings = {};

    const selectEl = document.getElementById('deviceSelect');
    const saveBtn = document.getElementById('saveBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const alertBox = document.getElementById('alertBox');
    const serviceAccountInput = document.getElementById('serviceAccountInput');
    const browseBtn = document.getElementById('browseBtn');

    // Custom Time Picker DOM Elements
    const cutoffDisplay = document.getElementById('cutoffDisplay');
    const cutoffValueText = document.getElementById('cutoffValueText');
    const timePickerDropdown = document.getElementById('timePickerDropdown');
    const hourScroll = document.getElementById('hourScroll');
    const minuteScroll = document.getElementById('minuteScroll');
    const closeTimePicker = document.getElementById('closeTimePicker');

    // Custom Time Picker State Variables
    let selectedHour = "09";
    let selectedMinute = "30";
    let selectedPeriod = "AM";

    // Populate Hour Scroll List (01 - 12)
    for (let i = 1; i <= 12; i++) {
      const hr = String(i).padStart(2, '0');
      const item = document.createElement('div');
      item.className = 'time-item' + (hr === selectedHour ? ' selected' : '');
      item.textContent = hr;
      item.dataset.val = hr;
      item.addEventListener('click', (e) => {
        hourScroll.querySelectorAll('.time-item').forEach(el => el.classList.remove('selected'));
        item.classList.add('selected');
        selectedHour = hr;
        updateTimeText();
      });
      hourScroll.appendChild(item);
    }

    // Populate Minute Scroll List (00 - 59)
    for (let i = 0; i < 60; i++) {
      const min = String(i).padStart(2, '0');
      const item = document.createElement('div');
      item.className = 'time-item' + (min === selectedMinute ? ' selected' : '');
      item.textContent = min;
      item.dataset.val = min;
      item.addEventListener('click', (e) => {
        minuteScroll.querySelectorAll('.time-item').forEach(el => el.classList.remove('selected'));
        item.classList.add('selected');
        selectedMinute = min;
        updateTimeText();
      });
      minuteScroll.appendChild(item);
    }

    // AM/PM Period Selection listeners
    document.querySelectorAll('.period-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.period-item').forEach(el => el.classList.remove('selected'));
        item.classList.add('selected');
        selectedPeriod = item.dataset.val;
        updateTimeText();
      });
    });

    // Helper to update display box text
    function updateTimeText() {
      cutoffValueText.textContent = `${selectedHour}:${selectedMinute} ${selectedPeriod}`;
    }

    // Helper to convert "09:30" (24h) to display state
    function loadTimeSetting(timeStr) {
      if (!timeStr) timeStr = "09:30";
      const [hrs, mins] = timeStr.split(':').map(Number);
      const period = hrs >= 12 ? 'PM' : 'AM';
      const dispHours = hrs % 12 === 0 ? 12 : hrs % 12;
      
      selectedHour = String(dispHours).padStart(2, '0');
      selectedMinute = String(mins).padStart(2, '0');
      selectedPeriod = period;

      updateTimeText();

      // Highlight selected items in lists
      hourScroll.querySelectorAll('.time-item').forEach(el => {
        el.classList.toggle('selected', el.dataset.val === selectedHour);
      });
      minuteScroll.querySelectorAll('.time-item').forEach(el => {
        el.classList.toggle('selected', el.dataset.val === selectedMinute);
      });
      document.querySelectorAll('.period-item').forEach(el => {
        el.classList.toggle('selected', el.dataset.val === selectedPeriod);
      });
    }

    // Helper to convert current selection back to "09:30" (24h) for save
    function getSelected24hTime() {
      let hours = parseInt(selectedHour, 10);
      if (selectedPeriod === 'PM' && hours < 12) hours += 12;
      if (selectedPeriod === 'AM' && hours === 12) hours = 0;
      return `${String(hours).padStart(2, '0')}:${selectedMinute}`;
    }

    // Toggle Dropdown
    cutoffDisplay.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = timePickerDropdown.style.display === 'flex';
      timePickerDropdown.style.display = isOpen ? 'none' : 'flex';
      
      if (!isOpen) {
        // Auto-scroll selected elements into view smoothly when opening
        setTimeout(() => {
          const selHour = hourScroll.querySelector('.time-item.selected');
          const selMinute = minuteScroll.querySelector('.time-item.selected');
          if (selHour) selHour.scrollIntoView({ block: 'center', behavior: 'smooth' });
          if (selMinute) selMinute.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }, 100);
      }
    });

    closeTimePicker.addEventListener('click', (e) => {
      e.stopPropagation();
      timePickerDropdown.style.display = 'none';
    });

    // Close on click outside
    document.addEventListener('click', (e) => {
      if (!timePickerDropdown.contains(e.target) && e.target !== cutoffDisplay) {
        timePickerDropdown.style.display = 'none';
      }
    });

    // Show status logs
    const showMessage = (msg, isError = false) => {
      alertBox.textContent = msg;
      alertBox.className = `status-alert ${isError ? 'status-error' : 'status-success'}`;
      alertBox.style.display = 'block';
    };

    const hideMessage = () => {
      alertBox.style.display = 'none';
    };

    // Load active devices list via PWA authenticated bridge
    const loadDevices = async () => {
      selectEl.disabled = true;
      saveBtn.disabled = !serviceAccountInput.value;
      refreshBtn.disabled = true;
      selectEl.innerHTML = '<option value="">Searching for devices...</option>';
      hideMessage();

      try {
        // Call the secure PWA bridge
        fetchedDevices = await window.settingsAPI.requestDevices();

        if (!fetchedDevices || fetchedDevices.length === 0) {
          selectEl.innerHTML = '<option value="">No devices registered centrally</option>';
          showMessage("No active devices found. Make sure you are registered and logged in as Admin in the main window.", true);
          refreshBtn.disabled = false;
          saveBtn.disabled = !serviceAccountInput.value;
          return;
        }

        // Populating dropdown
        selectEl.innerHTML = '<option value="">-- Choose registered device name --</option>';
        fetchedDevices.forEach(device => {
          const option = document.createElement('option');
          option.value = device.id;
          option.textContent = device.deviceName;
          if (savedSettings.deviceId === device.id) {
            option.selected = true;
          }
          selectEl.appendChild(option);
        });

        selectEl.disabled = false;
        refreshBtn.disabled = false;
        saveBtn.disabled = !selectEl.value && !serviceAccountInput.value;
      } catch (err) {
        console.error("Fetch devices failure:", err);
        selectEl.innerHTML = '<option value="">Failed to fetch devices</option>';
        showMessage("Failed to sync devices. Note: You must log into the Admin panel in the main window before syncing.", true);
        refreshBtn.disabled = false;
        saveBtn.disabled = !serviceAccountInput.value;
      }
    };

    // Enable/disable Save button on dropdown change
    selectEl.addEventListener('change', () => {
      saveBtn.disabled = !selectEl.value && !serviceAccountInput.value;
    });

    // Browse for JSON file
    browseBtn.addEventListener('click', async () => {
      try {
        const filePath = await window.settingsAPI.selectServiceAccountKey();
        if (filePath) {
          serviceAccountInput.value = filePath;
          saveBtn.disabled = false;
        }
      } catch (err) {
        console.error('File dialog error:', err);
      }
    });

    // Cancel / close settings window
    cancelBtn.addEventListener('click', () => {
      window.settingsAPI.closeSettingsWindow();
    });

    // Refresh devices list
    refreshBtn.addEventListener('click', async () => {
      await loadDevices();
    });

    // Save selected device settings
    saveBtn.addEventListener('click', async () => {
      const selectedId = selectEl.value;
      const device = fetchedDevices.find(d => d.id === selectedId);
      
      saveBtn.disabled = true;
      selectEl.disabled = true;
      refreshBtn.disabled = true;
      browseBtn.disabled = true;
      showMessage("Saving settings and initializing connection...");

      try {
        // Save settings to local userData file via Electron API (this triggers ZKFinger init and Firestore update)
        await window.settingsAPI.saveLocalSettings({
          deviceId: device ? device.id : (savedSettings.deviceId || null),
          deviceName: device ? device.deviceName : (savedSettings.deviceName || null),
          licenseKey: device ? device.licenseKey : (savedSettings.licenseKey || null),
          serviceAccountKeyPath: serviceAccountInput.value || null,
          lateCutoffTime: getSelected24hTime(),
          lastSyncedAt: new Date().toISOString()
        });

        showMessage("Configuration saved and connection initialized!");
        setTimeout(() => {
          window.settingsAPI.closeSettingsWindow();
        }, 1500);
      } catch (err) {
        console.error("Failed to save settings:", err);
        showMessage(`Failed to save settings: ${err.message}`, true);
        saveBtn.disabled = false;
        selectEl.disabled = false;
        refreshBtn.disabled = false;
        browseBtn.disabled = false;
      }
    });

    // Startup flow
    window.addEventListener('DOMContentLoaded', async () => {
      // Load current local cached settings
      try {
        savedSettings = await window.settingsAPI.getLocalSettings() || {};
        if (savedSettings.serviceAccountKeyPath) {
          serviceAccountInput.value = savedSettings.serviceAccountKeyPath;
        }
        loadTimeSetting(savedSettings.lateCutoffTime || '09:30');
      } catch (e) {
        console.error("Local settings load failed:", e);
      }

      await loadDevices();
    });
  </script>
</body>
</html>
