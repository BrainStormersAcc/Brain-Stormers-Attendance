<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Brain Stormers Attendance - Error</title>
  <style>
    :root {
      --bg-base: #1c1f26;
      --bg-surface: #1c1f26;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --color-danger: #f87171;
      --border-color: rgba(255, 255, 255, 0.03);
      
      /* Neumorphic Shadows */
      --color-shadow-light: #252932;
      --color-shadow-dark: #13151a;
      --neu-shadow-raised: -8px -8px 16px var(--color-shadow-light), 8px 8px 16px var(--color-shadow-dark);
      --neu-shadow-pressed: inset -4px -4px 8px var(--color-shadow-light), inset 4px 4px 8px var(--color-shadow-dark);
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      box-shadow: var(--neu-shadow-raised);
      padding: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 450px;
      width: 85%;
      text-align: center;
    }
    
    .error-icon-container {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      box-shadow: var(--neu-shadow-raised);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
      position: relative;
    }

    .error-glow {
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      bottom: 6px;
      border-radius: 50%;
      box-shadow: var(--neu-shadow-pressed);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-danger);
    }
    
    h1 {
      font-size: 1.3rem;
      margin: 0 0 16px 0;
      font-weight: 700;
      color: var(--text-primary);
    }
    
    p {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin: 0 0 24px 0;
      line-height: 1.6;
    }
    
    .code-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      box-shadow: var(--neu-shadow-pressed);
      padding: 12px 16px;
      border-radius: 12px;
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--color-danger);
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    .neu-btn {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: var(--neu-shadow-raised);
      padding: 12px 24px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      outline: none;
      transition: box-shadow 0.2s, background-color 0.2s, transform 0.2s;
      margin-top: 20px;
    }
    .neu-btn:hover {
      background: #252932;
      transform: translateY(-1px);
    }
    .neu-btn:active {
      box-shadow: var(--neu-shadow-pressed);
      transform: translateY(0);
    }
    .neu-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="error-icon-container">
      <div class="error-glow">
        <span style="font-size: 2rem;">⚠️</span>
      </div>
    </div>
    <h1>Build Not Found</h1>
    <p>The desktop app expects the main React application to be compiled. Please run the build command in the main project root directory first, then restart this application.</p>
    <div class="code-box">
      npm run build
    </div>
    <button type="button" id="retryBtn" class="neu-btn">
      Retry Loading
    </button>
  </div>

  <script>
    const retryBtn = document.getElementById('retryBtn');
    retryBtn.addEventListener('click', () => {
      retryBtn.textContent = 'Rechecking...';
      retryBtn.disabled = true;
      if (window.settingsAPI && window.settingsAPI.retryInitialization) {
        window.settingsAPI.retryInitialization();
      } else {
        setTimeout(() => {
          window.location.reload();
        }, 1000);
      }
    });

    if (window.settingsAPI && window.settingsAPI.onRetryResponse) {
      window.settingsAPI.onRetryResponse((status) => {
        if (!status.success) {
          retryBtn.textContent = 'Retry Loading';
          retryBtn.disabled = false;
          alert('Build directory still not found. Please run "npm run build" in the main root directory.');
        }
      });
    }
  </script>
</body>
</html>
