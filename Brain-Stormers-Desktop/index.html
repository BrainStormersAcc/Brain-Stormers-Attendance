<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Brain Stormers Attendance</title>
  <style>
    :root {
      --bg-base: #1c1f26;
      --bg-surface: #1c1f26;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --color-primary: #8a9ab8;
      --border-color: rgba(255, 255, 255, 0.03);
      
      /* Neumorphic Shadows for dark mode */
      --color-shadow-light: #252932;
      --color-shadow-dark: #13151a;
      --neu-shadow-raised: -8px -8px 16px var(--color-shadow-light), 8px 8px 16px var(--color-shadow-dark);
      --neu-shadow-pressed: inset -4px -4px 8px var(--color-shadow-light), inset 4px 4px 8px var(--color-shadow-dark);
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      box-shadow: var(--neu-shadow-raised);
      padding: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 400px;
      width: 80%;
      text-align: center;
    }
    
    .logo-container {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      box-shadow: var(--neu-shadow-raised);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
      position: relative;
    }

    .logo-glow {
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      bottom: 6px;
      border-radius: 50%;
      box-shadow: var(--neu-shadow-pressed);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon {
      font-size: 2rem;
      animation: pulse 2s ease-in-out infinite;
    }
    
    .loader {
      border: 4px solid var(--color-shadow-dark);
      border-top: 4px solid var(--color-primary);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      margin-bottom: 24px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    
    h1 {
      font-size: 1.4rem;
      margin: 0 0 8px 0;
      font-weight: 700;
      font-family: system-ui, -apple-system, sans-serif;
      letter-spacing: 0.02em;
    }
    
    p {
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin: 0;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <div class="logo-glow">
        <span class="logo-icon">🤖</span>
      </div>
    </div>
    <div class="loader"></div>
    <h1>Brain Stormers</h1>
    <p>Loading application resources...</p>
  </div>
</body>
</html>
